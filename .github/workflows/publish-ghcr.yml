name: Publish GHCR images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .build-variants
      - entrypoint.sh
      - proxy/**
      - manager/**
      - .github/workflows/publish-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: none
            rolling_tag: latest
            version_tag: 0.2.3-alpha.2
          - variant: devtools
            rolling_tag: devtools-latest
            version_tag: devtools-0.2.3-alpha.2
          - variant: test
            rolling_tag: test-latest
            version_tag: test-0.2.3-alpha.2
          - variant: admin
            rolling_tag: admin-latest
            version_tag: admin-0.2.3-alpha.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/minghuiliu/deepseek-harness-docker
          tags: |
            type=raw,value=${{ matrix.rolling_tag }}
            type=raw,value=${{ matrix.version_tag }}
            type=sha,prefix=${{ matrix.rolling_tag }}-sha-

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEV_TOOLS=${{ matrix.variant }}
            DSH_VERSION=0.2.3-alpha.2
            PNPM_VERSION=11.28.5
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
